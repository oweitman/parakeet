# Include inside nginx's http context. Replace domain and certificate paths.
map $http_upgrade $parakeet_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name transcribe.example.org;
    return 301 https://transcribe.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name transcribe.example.org;

    ssl_certificate     /etc/letsencrypt/live/transcribe.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transcribe.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $parakeet_connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1900s;
        proxy_send_timeout 1900s;
        proxy_buffering off;
    }
}
